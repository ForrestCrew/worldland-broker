# Sample GPU pod for testing Kind cluster setup
# Tests: nodeSelector, tolerations, worldland labels
# Note: nvidia.com/gpu resources are commented out for local testing (requires real GPU or device plugin)
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-pod
  namespace: tenant-test
  labels:
    worldland.io/session-id: "test-session-001"
    worldland.io/provider-id: "provider-001"
    worldland.io/gpu-rental: "true"
spec:
  restartPolicy: Never
  # Select specific provider node
  nodeSelector:
    worldland.io/provider-id: "provider-001"
  # Tolerations for dedicated rental nodes
  tolerations:
  - key: worldland.io/dedicated-rental
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  containers:
  - name: gpu-workload
    # Use simple busybox for local testing (CUDA images require real GPU)
    image: busybox:1.36
    command: ["sh", "-c", "echo 'GPU pod running (simulated)' && sleep 3600"]
    resources:
      limits:
        # nvidia.com/gpu: "1"  # Uncomment when real GPU or device plugin available
        cpu: "500m"
        memory: "256Mi"
      requests:
        # nvidia.com/gpu: "1"  # Uncomment when real GPU or device plugin available
        cpu: "100m"
        memory: "128Mi"
